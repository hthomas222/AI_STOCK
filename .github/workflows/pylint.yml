name: Python Linter
on: 
  push:
    branches: 
      - main  
jobs:
  deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps: 
    - uses: actions/checkout@v4
   # - run: pip install -r requirements.txt
  ruff_check:
    runs-on: ubuntu-latest
    steps:
      - name: ruff check
        uses: astral-sh/ruff-action@v1
        with:
          args: check .
